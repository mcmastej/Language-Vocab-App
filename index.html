<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Korean Memory Game</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <h1>Korean Memory</h1>
      <p id="subtitle">Choose a learning mode.</p>
    </div>
    <div id="scoreBox" class="score hidden">High score: <span id="highScore">0</span></div>
  </header>

  <section id="homeScreen" class="panel home-panel">
    <h2>Choose a mode</h2>
    <div class="mode-grid">
      <button id="speakingModeBtn" class="mode-card">
        <strong>Speaking/Writing</strong>
        <span>See an image, remember it, then produce the Korean word.</span>
      </button>
      <button id="listeningModeBtn" class="mode-card">
        <strong>Listening/Reading</strong>
        <span>See and hear a Korean word, remember it, then choose the correct image.</span>
      </button>
    </div>
  </section>

  <section id="startScreen" class="panel hidden">
    <h2 id="modeTitle"></h2>
    <p id="modeInstructions"></p>
    <div class="actions">
      <button id="startBtn" class="primary">Start game</button>
      <button id="startHomeBtn" type="button">Home</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="levelbar">
      <strong>Level <span id="level">1</span></strong>
      <span id="status"></span>
      <button id="gameHomeBtn" class="home-button" type="button">Home</button>
    </div>

    <!-- Speaking/Writing stages -->
    <div id="imageStage" class="stage hidden">
      <div id="wordImage" class="word-image"></div>
      <div id="partOfSpeech" class="part-of-speech"></div>
    </div>

    <div id="wordStage" class="stage word-stage hidden">
      <div id="presentedWord" class="presented-word" lang="ko"></div>
    </div>

    <div id="blankStage" class="stage blank hidden"></div>

    <div id="answerStage" class="stage answer-stage hidden">
      <form id="answerForm" autocomplete="off">
        <label for="answerInput">Your answer</label>
        <div class="answer-row">
          <input id="answerInput" inputmode="text" lang="ko" autocapitalize="off" spellcheck="false" placeholder="Type Korean">
          <button id="speakBtn" type="button">Speak</button>
        </div>
        <button class="primary" type="submit">Submit</button>
      </form>
      <p id="speechNote" class="note">Speech input is optional. If available, it fills the box; you still press Submit.</p>
    </div>

    <!-- Listening/Reading multiple choice -->
    <div id="choiceStage" class="stage choice-stage hidden">
      <div id="choiceGrid" class="choice-grid"></div>
    </div>

    <div id="correctStage" class="stage result hidden">
      <h2>Correct!</h2>
      <p>Next level…</p>
    </div>

    <div id="wrongStage" class="stage result hidden">
      <h2>Incorrect</h2>
      <p>The correct answer was:</p>
      <div id="correctAnswer" class="correct-answer" lang="ko"></div>
      <div class="actions">
        <button id="hearBtn" type="button">Hear word</button>
        <button id="restartBtn" type="button">Restart</button>
        <button id="wrongHomeBtn" type="button">Home</button>
      </div>
    </div>
  </section>

  <footer><span>V7.1 · 30 words · two learning modes</span></footer>
</main>
<script src="words.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
</script>
</body>
</html>
